<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040">
  <style>
    text { font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif; }
    .title { fill:#111827; font-size:22px; font-weight:600; }
    .subtitle { fill:#6b7280; font-size:12px; }
    .section { fill:#374151; font-size:14px; font-weight:600; }
    .main { fill:#111827; font-size:12px; font-weight:600; }
    .body { fill:#4b5563; font-size:10px; }
    .small { fill:#6b7280; font-size:10px; }
    .label { fill:#374151; font-size:10px; font-weight:600; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
  </defs>

  <rect width="1200" height="1040" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" class="title">订阅计费指标树与治理闭环</text>
  <text x="600" y="58" text-anchor="middle" class="subtitle">目标指标衡量业务结果，过程指标解释结果在价值流哪一段形成或损失，护栏指标约束局部优化</text>

  <rect x="390" y="88" width="420" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="600" y="119" text-anchor="middle" class="section">订阅计费总目标</text>
  <text x="600" y="144" text-anchor="middle" class="main">让每一份订阅承诺可靠地变成可收回的收入</text>

  <path d="M600 166 L600 202 L128 202 L128 242" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M600 202 L364 202 L364 242" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M600 166 L600 242" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M600 202 L836 202 L836 242" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M600 202 L1072 202 L1072 242" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="550" y="184" width="100" height="18" rx="3" fill="#ffffff" opacity="0.96"/><text x="600" y="196" text-anchor="middle" class="label">分解目标维度</text>

  <g>
    <rect x="42" y="242" width="172" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="128" y="274" text-anchor="middle" class="main">收入增长</text><text x="128" y="298" text-anchor="middle" class="body">订阅净增与留存</text>
    <rect x="278" y="242" width="172" height="86" rx="8" fill="#faf5ff" stroke="#c4b5fd"/><text x="364" y="274" text-anchor="middle" class="main">计费正确性</text><text x="364" y="298" text-anchor="middle" class="body">金额、周期与税费可信</text>
    <rect x="514" y="242" width="172" height="86" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="600" y="274" text-anchor="middle" class="main">收款效率</text><text x="600" y="298" text-anchor="middle" class="body">应收在承诺周期内收回</text>
    <rect x="750" y="242" width="172" height="86" rx="8" fill="#f0fdfa" stroke="#5eead4"/><text x="836" y="274" text-anchor="middle" class="main">服务连续性</text><text x="836" y="298" text-anchor="middle" class="body">不因计费问题误伤用户</text>
    <rect x="986" y="242" width="172" height="86" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="1072" y="274" text-anchor="middle" class="main">风险与合规</text><text x="1072" y="298" text-anchor="middle" class="body">资金、审计与租户隔离</text>
  </g>

  <text x="56" y="370" class="section">目标指标 · 最终结果</text>
  <rect x="42" y="386" width="1116" height="106" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <g>
    <rect x="62" y="410" width="132" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/><text x="128" y="434" text-anchor="middle" class="main">MRR 与净留存</text><text x="128" y="454" text-anchor="middle" class="small">新增 / 扩张 / 流失</text>
    <rect x="298" y="410" width="132" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/><text x="364" y="434" text-anchor="middle" class="main">发票零差错率</text><text x="364" y="454" text-anchor="middle" class="small">金额 / 周期 / 税费</text>
    <rect x="534" y="410" width="132" height="58" rx="8" fill="#ffffff" stroke="#fdba74"/><text x="600" y="434" text-anchor="middle" class="main">应收回收率</text><text x="600" y="454" text-anchor="middle" class="small">回款周期与账龄</text>
    <rect x="770" y="410" width="132" height="58" rx="8" fill="#ffffff" stroke="#5eead4"/><text x="836" y="434" text-anchor="middle" class="main">误阻断率</text><text x="836" y="454" text-anchor="middle" class="small">阻断与恢复时长</text>
    <rect x="1006" y="410" width="132" height="58" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="1072" y="434" text-anchor="middle" class="main">资金差异率</text><text x="1072" y="454" text-anchor="middle" class="small">对账 / 退款 / 审计</text>
  </g>

  <path d="M128 328 L128 410" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M364 328 L364 410" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M600 328 L600 410" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M836 328 L836 410" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M1072 328 L1072 410" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <text x="56" y="534" class="section">过程指标 · 解释价值流在哪个环节形成或损失</text>
  <rect x="42" y="550" width="1116" height="188" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="252" y1="570" x2="252" y2="718" stroke="#e5e7eb"/><line x1="470" y1="570" x2="470" y2="718" stroke="#e5e7eb"/><line x1="688" y1="570" x2="688" y2="718" stroke="#e5e7eb"/><line x1="906" y1="570" x2="906" y2="718" stroke="#e5e7eb"/>
  <g>
    <text x="142" y="584" text-anchor="middle" class="main">签约与目录</text><text x="72" y="614" class="body">目录发布成功率</text><text x="72" y="638" class="body">订阅创建成功率</text><text x="72" y="662" class="body">待生效订阅存量</text><text x="72" y="686" class="body">准入拒绝原因分布</text>
    <text x="361" y="584" text-anchor="middle" class="main">订阅推进</text><text x="282" y="614" class="body">阶段自动推进准点率</text><text x="282" y="638" class="body">变更生效准确率</text><text x="282" y="662" class="body">挂起与阻断订阅存量</text><text x="282" y="686" class="body">变更失败原因分布</text>
    <text x="579" y="584" text-anchor="middle" class="main">出账</text><text x="500" y="614" class="body">出账任务准点率</text><text x="500" y="638" class="body">试算与终稿差异率</text><text x="500" y="662" class="body">草稿滞留发票存量</text><text x="500" y="686" class="body">出账失败原因分布</text>
    <text x="797" y="584" text-anchor="middle" class="main">支付</text><text x="718" y="614" class="body">首次扣款成功率</text><text x="718" y="638" class="body">资金结果确认时长</text><text x="718" y="662" class="body">待确认支付存量</text><text x="718" y="686" class="body">网关拒绝原因分布</text>
    <text x="1015" y="584" text-anchor="middle" class="main">逾期与处置</text><text x="936" y="614" class="body">重试收回率</text><text x="936" y="638" class="body">逾期升级时长</text><text x="936" y="662" class="body">逾期账户与账龄存量</text><text x="936" y="686" class="body">坏账与信用分布</text>
  </g>

  <path d="M600 492 L600 524" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="548" y="502" width="104" height="18" rx="3" fill="#ffffff"/><text x="600" y="514" text-anchor="middle" class="label">沿价值流归因</text>

  <text x="56" y="780" class="section">护栏指标 · 防止局部优化破坏正确性、风险和体验</text>
  <rect x="42" y="796" width="1116" height="90" rx="8" fill="#fef2f2" fill-opacity="0.65" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="66" y="820" width="190" height="42" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="161" y="846" text-anchor="middle" class="main">重复扣款 / 重复出账</text>
  <rect x="282" y="820" width="190" height="42" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="377" y="846" text-anchor="middle" class="main">超额退款 / 超发信用</text>
  <rect x="498" y="820" width="190" height="42" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="593" y="846" text-anchor="middle" class="main">误阻断与投诉率</text>
  <rect x="714" y="820" width="190" height="42" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="809" y="846" text-anchor="middle" class="main">插件故障导致的降级</text>
  <rect x="930" y="820" width="190" height="42" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="1025" y="846" text-anchor="middle" class="main">人工调整与规则绕过</text>
  <path d="M600 738 L600 786" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <text x="56" y="928" class="section">业务监控与能力演进闭环</text>
  <rect x="42" y="944" width="1116" height="64" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <g>
    <rect x="72" y="958" width="128" height="36" rx="8" fill="#ffffff" stroke="#86efac"/><text x="136" y="981" text-anchor="middle" class="main">发现偏离</text>
    <path d="M200 976 L248 976" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <rect x="248" y="958" width="128" height="36" rx="8" fill="#ffffff" stroke="#86efac"/><text x="312" y="981" text-anchor="middle" class="main">定位能力与事实</text>
    <path d="M376 976 L424 976" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <rect x="424" y="958" width="128" height="36" rx="8" fill="#ffffff" stroke="#86efac"/><text x="488" y="981" text-anchor="middle" class="main">处置与恢复</text>
    <path d="M552 976 L600 976" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <rect x="600" y="958" width="128" height="36" rx="8" fill="#ffffff" stroke="#86efac"/><text x="664" y="981" text-anchor="middle" class="main">验证指标</text>
    <path d="M728 976 L776 976" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <rect x="776" y="958" width="128" height="36" rx="8" fill="#ffffff" stroke="#86efac"/><text x="840" y="981" text-anchor="middle" class="main">复盘根因</text>
    <path d="M904 976 L952 976" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <rect x="952" y="958" width="128" height="36" rx="8" fill="#ffffff" stroke="#86efac"/><text x="1016" y="981" text-anchor="middle" class="main">演进能力与规则</text>
  </g>
  <path d="M1016 958 L1016 914 L220 914 L220 886" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="610" y="910" text-anchor="middle" class="small">复盘结果进入能力路线图；能力若落在扩展点后面，演进方式就是换一个插件而不是改核心</text>
</svg>
