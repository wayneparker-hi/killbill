<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { fill:#111827; font-size:22px; font-weight:600; }
    .subtitle { fill:#6b7280; font-size:12px; }
    .view { fill:#111827; font-size:15px; font-weight:600; }
    .viewsub { fill:#6b7280; font-size:11px; }
    .item { fill:#1f2937; font-size:11px; }
    .badge { fill:#111827; font-size:11px; font-weight:600; }
    .small { fill:#6b7280; font-size:10px; }
    .th { fill:#111827; font-size:12px; font-weight:600; }
    .td { fill:#374151; font-size:11px; }
    .mark { fill:#111827; font-size:14px; font-weight:600; }
  </style>
  <defs>
    <marker id="i-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#6b7280"/></marker>
  </defs>

  <rect width="1400" height="1050" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" class="title">视图整合与对齐 —— 冲突全都横跨两个视图</text>
  <text x="700" y="56" text-anchor="middle" class="subtitle">五个视图不是五份独立文档，是同一个系统的五个投影；下面每处红色标记，都是只有把两个视图放在一起才会暴露的问题</text>

  <!-- ===== 场景视图 ===== -->
  <rect x="300" y="86" width="800" height="110" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="700" y="116" text-anchor="middle" class="view">场景视图（+1）　18 个用例 · 5 条非功能需求</text>
  <text x="700" y="142" text-anchor="middle" class="viewsub">它不描述系统怎么实现，只提供验证标准：其余四个视图必须能解释这些用例怎么跑</text>
  <text x="700" y="164" text-anchor="middle" class="viewsub">关键发现——18 个用例里只有 7 个由人工请求驱动，其余由定时器、网关回调与集群命令驱动</text>
  <text x="700" y="184" text-anchor="middle" class="small">这一条直接决定了进程视图必须画线程池接力，而不是画一条 HTTP 请求链</text>

  <path d="M350 196 L350 244" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#i-gray)"/>
  <path d="M1050 196 L1050 244" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#i-gray)"/>
  <path d="M300 140 L120 140 L120 645 L174 645" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#i-gray)"/>
  <path d="M1100 140 L1280 140 L1280 645 L1226 645" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#i-gray)"/>

  <!-- ===== 逻辑视图 ===== -->
  <rect x="180" y="250" width="340" height="170" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="350" y="278" text-anchor="middle" class="view">逻辑视图</text>
  <text x="350" y="298" text-anchor="middle" class="viewsub">给设计者 · 类与关系</text>
  <text x="196" y="326" class="item">· lpr-api / lpr-spi 的分层规则</text>
  <text x="196" y="348" class="item">· DefaultServiceRegistry 的键设计</text>
  <text x="196" y="370" class="item">· ClassLoaderPolicy 与 ResourceRegistry</text>
  <text x="196" y="392" class="item">· 桥接层的八个类</text>
  <text x="196" y="412" class="small">承担 NFR-1 · NFR-2</text>

  <!-- ===== 开发视图 ===== -->
  <rect x="880" y="250" width="340" height="170" rx="8" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="1050" y="278" text-anchor="middle" class="view">开发视图</text>
  <text x="1050" y="298" text-anchor="middle" class="viewsub">给开发者 · 模块与依赖</text>
  <text x="896" y="326" class="item">· 88 模块六层，箭头一律向上</text>
  <text x="896" y="348" class="item">· lpr/ 与 killbill 契约之间零依赖</text>
  <text x="896" y="370" class="item">· 两条红色禁止边</text>
  <text x="896" y="392" class="item">· 插件 pom 的作用域规则</text>
  <text x="896" y="412" class="small">承担 NFR-2 · NFR-5</text>

  <!-- ===== 进程视图 ===== -->
  <rect x="180" y="560" width="340" height="170" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
  <text x="350" y="588" text-anchor="middle" class="view">进程视图</text>
  <text x="350" y="608" text-anchor="middle" class="viewsub">给集成者 · 并发与时序</text>
  <text x="196" y="636" class="item">· 三个线程池接力完成一次计费</text>
  <text x="196" y="658" class="item">· 账户级锁的持有区间</text>
  <text x="196" y="680" class="item">· 网关调用的超时预算</text>
  <text x="196" y="702" class="item">· 热升级四阶段与撤销顺序</text>
  <text x="196" y="722" class="small">承担 NFR-1 · NFR-3</text>

  <!-- ===== 物理视图 ===== -->
  <rect x="880" y="560" width="340" height="170" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
  <text x="1050" y="588" text-anchor="middle" class="view">物理视图</text>
  <text x="1050" y="608" text-anchor="middle" class="viewsub">给运维者 · 部署与拓扑</text>
  <text x="896" y="636" class="item">· 四层部署 + 横向外部依赖</text>
  <text x="896" y="658" class="item">· 数据库是唯一共享状态与协调点</text>
  <text x="896" y="680" class="item">· plugins/ 是唯一节点本地状态</text>
  <text x="896" y="702" class="item">· 单点与副本数一览</text>
  <text x="896" y="722" class="small">承担 NFR-4</text>

  <!-- ===== 冲突 ① 逻辑 ↔ 开发 ===== -->
  <line x1="520" y1="295" x2="540" y2="295" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="860" y1="295" x2="880" y2="295" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="540" y="250" width="320" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="700" y="274" text-anchor="middle" class="badge" fill="#dc2626">冲突 ①　逻辑 ↔ 开发：EventBus 该放哪一层</text>
  <text x="700" y="298" text-anchor="middle" class="small">逻辑上它是插件直接调用的契约，实现却是可替换的基础设施；</text>
  <text x="700" y="320" text-anchor="middle" class="small">两个视图各按自己的规则分层，就会得出相反的答案。</text>

  <!-- ===== 中心：跨对角 ===== -->
  <rect x="540" y="360" width="320" height="170" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="700" y="384" text-anchor="middle" class="badge">跨对角的两处冲突</text>
  <line x1="560" y1="394" x2="840" y2="394" stroke="#e5e7eb"/>
  <text x="700" y="416" text-anchor="middle" class="badge" fill="#dc2626">⑤　逻辑 ↔ 物理</text>
  <text x="700" y="438" text-anchor="middle" class="small">ResourceRegistry 保证 ClassLoader 可回收，</text>
  <text x="700" y="456" text-anchor="middle" class="small">但这条保证只在单个 JVM 进程内成立。</text>
  <text x="700" y="484" text-anchor="middle" class="badge" fill="#dc2626">⑥　开发 ↔ 进程</text>
  <text x="700" y="506" text-anchor="middle" class="small">模块无依赖不等于运行时无耦合：</text>
  <text x="700" y="524" text-anchor="middle" class="small">插件慢会直接拖住调用方的线程。</text>

  <!-- ===== 冲突 ③ 逻辑 ↔ 进程 ===== -->
  <line x1="350" y1="420" x2="350" y2="440" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="350" y1="540" x2="350" y2="560" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="180" y="440" width="340" height="100" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="350" y="464" text-anchor="middle" class="badge" fill="#dc2626">冲突 ③　逻辑 ↔ 进程：撤销与 stop 的顺序</text>
  <text x="350" y="488" text-anchor="middle" class="small">类图看不出顺序。只有把时序画出来，才会发现</text>
  <text x="350" y="508" text-anchor="middle" class="small">「先撤注册、再 stop」是必需的——反过来会有一段</text>
  <text x="350" y="528" text-anchor="middle" class="small">窗口，流量打到已经关掉资源的旧实例上。</text>

  <!-- ===== 冲突 ④ 开发 ↔ 物理 ===== -->
  <line x1="1050" y1="420" x2="1050" y2="440" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="1050" y1="540" x2="1050" y2="560" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="880" y="440" width="340" height="100" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="1050" y="464" text-anchor="middle" class="badge" fill="#dc2626">冲突 ④　开发 ↔ 物理：同进程 ≠ 同模块</text>
  <text x="1050" y="488" text-anchor="middle" class="small">开发视图上核心与插件之间零依赖，物理视图上</text>
  <text x="1050" y="508" text-anchor="middle" class="small">它们共享同一个 JVM 堆。前者是编译期事实，</text>
  <text x="1050" y="528" text-anchor="middle" class="small">后者是运行期事实，两条都对。</text>

  <!-- ===== 冲突 ② 进程 ↔ 物理 ===== -->
  <line x1="520" y1="645" x2="540" y2="645" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="860" y1="645" x2="880" y2="645" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="540" y="600" width="320" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="700" y="624" text-anchor="middle" class="badge" fill="#dc2626">冲突 ②　进程 ↔ 物理：热升级只发生在本节点</text>
  <text x="700" y="648" text-anchor="middle" class="small">时序图画的是一个进程内的版本切换，</text>
  <text x="700" y="670" text-anchor="middle" class="small">而集群里有 N 份磁盘、N 个运行时。</text>

  <!-- ===== 底部：解法 ===== -->
  <text x="24" y="778" class="th">六处冲突的解法 —— 都不是「改图」，而是补上一条被两个视图各自默认掉的约定</text>
  <rect x="24" y="788" width="1352" height="88" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="40" y="812" class="td">① 分层判据改成「是模型还是基础设施」：契约留在 lpr-api，实现移到 lpr-event-default —— 由 TestArchitecturalConstraints 的新用例守护</text>
  <text x="40" y="834" class="td">② 升级是集群操作：命令必须经 nodesInfo 广播，每节点各自执行一遍　③ 停止顺序写进 TestDefaultPluginLifecycleManager，把顺序挪一下就会失败</text>
  <text x="40" y="856" class="td">④⑤ 隔离靠 ClassLoader + 资源托管而非进程边界，只能缓解不能消除，写进物理视图的取舍说明　⑥ 调用点统一 try/catch + 延迟埋点，让耦合可观测</text>

  <!-- ===== 底部：NFR 覆盖矩阵 ===== -->
  <text x="24" y="906" class="th">非功能需求覆盖矩阵 —— 每一条 NFR 都必须至少有一个视图「主要承担」，否则它只是一句口号</text>
  <rect x="24" y="916" width="1352" height="98" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <rect x="24" y="916" width="1352" height="30" rx="8" fill="#f9fafb"/>
  <line x1="24" y1="946" x2="1376" y2="946" stroke="#d1d5db"/>
  <line x1="424" y1="916" x2="424" y2="1014" stroke="#e5e7eb"/>
  <line x1="614" y1="916" x2="614" y2="1014" stroke="#e5e7eb"/>
  <line x1="804" y1="916" x2="804" y2="1014" stroke="#e5e7eb"/>
  <line x1="994" y1="916" x2="994" y2="1014" stroke="#e5e7eb"/>
  <line x1="1184" y1="916" x2="1184" y2="1014" stroke="#e5e7eb"/>
  <text x="40" y="936" class="th">非功能需求</text>
  <text x="519" y="936" text-anchor="middle" class="th">场景</text>
  <text x="709" y="936" text-anchor="middle" class="th">逻辑</text>
  <text x="899" y="936" text-anchor="middle" class="th">开发</text>
  <text x="1089" y="936" text-anchor="middle" class="th">进程</text>
  <text x="1280" y="936" text-anchor="middle" class="th">物理</text>

  <text x="40" y="966" class="td">NFR-1 升级无空窗</text>
  <text x="519" y="967" text-anchor="middle" class="mark" fill="#9ca3af">○</text><text x="709" y="967" text-anchor="middle" class="mark" fill="#2563eb">●</text><text x="899" y="967" text-anchor="middle" class="mark" fill="#d1d5db">–</text><text x="1089" y="967" text-anchor="middle" class="mark" fill="#2563eb">●</text><text x="1280" y="967" text-anchor="middle" class="mark" fill="#9ca3af">○</text>
  <text x="40" y="988" class="td">NFR-2 插件隔离与可卸载</text>
  <text x="519" y="989" text-anchor="middle" class="mark" fill="#9ca3af">○</text><text x="709" y="989" text-anchor="middle" class="mark" fill="#2563eb">●</text><text x="899" y="989" text-anchor="middle" class="mark" fill="#2563eb">●</text><text x="1089" y="989" text-anchor="middle" class="mark" fill="#9ca3af">○</text><text x="1280" y="989" text-anchor="middle" class="mark" fill="#9ca3af">○</text>
  <text x="40" y="1010" class="td">NFR-3 插件故障不拖垮核心　·　NFR-4 集群一致　·　NFR-5 核心不认识具体插件</text>
  <text x="519" y="1011" text-anchor="middle" class="mark" fill="#9ca3af">○</text><text x="709" y="1011" text-anchor="middle" class="mark" fill="#9ca3af">○</text><text x="899" y="1011" text-anchor="middle" class="mark" fill="#2563eb">●</text><text x="1089" y="1011" text-anchor="middle" class="mark" fill="#2563eb">●</text><text x="1280" y="1011" text-anchor="middle" class="mark" fill="#2563eb">●</text>

  <text x="1376" y="1038" text-anchor="end" class="small">● 主要承担　　○ 参与　　– 无关</text>
</svg>
