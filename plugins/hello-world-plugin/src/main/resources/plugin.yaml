# The plugin descriptor: what the OSGi build used to infer from bytecode.
#
# Under OSGi none of this was written down. The entry point was found by scanning the jar for a
# subclass of KillbillActivatorBase, the symbolic name was generated from the Maven coordinates,
# and package visibility came from a forty-line Import-Package instruction in the pom. Naming them
# here makes the answers greppable and reviewable.
id: hello-world
name: Hello World Plugin
version: 1.0.0
entrypoint:
  class: org.killbill.billing.plugin.helloworld.HelloWorldPlugin
config:
  helloworld.greeting: "Hello from LPR"
