name: Monorepo verification

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dev -d dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # This public release is distributed through an authenticated GitHub Maven repository.
      - uses: actions/checkout@v4
        with:
          repository: killbill/qualpay-java-client
          ref: f705d5aba34de727f9524002428e7ea5aaf2d4bb
          path: .ci/qualpay-java-client
          persist-credentials: false
      - name: Build official Qualpay client 1.1.9
        run: >-
          mvn -B -ff -f .ci/qualpay-java-client/java-client/pom.xml install
          -DskipTests=true -Dmaven.javadoc.skip=true
          -Dmaven.compiler.source=8 -Dmaven.compiler.target=8
      - name: Configure verification
        run: |
          cat > "$RUNNER_TEMP/killbill-mvn" <<'SCRIPT'
          #!/usr/bin/env bash
          exec mvn -B -ff \
            -Dcheck.skip-spotbugs=true -Dcheck.skip-dependency=true \
            -Dcheck.skip-dependency-scope=true -Dcheck.skip-dependency-versions=true \
            -Dcheck.skip-duplicate-finder=true -Dcheck.skip-enforcer=true -Dcheck.skip-rat=true "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/killbill-mvn"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build all modules and enforce plugin ABI
        run: killbill-mvn -T 1C clean install -DskipTests=true
      - name: Run runtime and plugin regressions
        env:
          TEST_JVM_ARGS: >-
            -Xmx1024m -Duser.language=en -Duser.country=US
            --add-opens java.base/java.lang=ALL-UNNAMED
            --add-opens java.base/java.io=ALL-UNNAMED
            --add-opens java.base/java.util=ALL-UNNAMED
            --add-opens java.base/java.base=ALL-UNNAMED
        run: |
          killbill-mvn -pl lpr/lpr-core,lpr/lpr-lifecycle-default,lpr/lpr-classloader-default,lpr/lpr-repository-filesystem,lpr/lpr-testkit,lpr/lpr-abi-validator,lpr/lpr-process,killbill-platform/plugin-runtime,plugins/hello-world-plugin test \
            -DsurefireArgLine="$TEST_JVM_ARGS"
          killbill-mvn -pl lpr/lpr-spi,lpr/lpr-descriptor-yaml,lpr/lpr-event-default,lpr/lpr-management,plugins/email-notifications-plugin,plugins/custom-email-invoice-formatter-plugin,plugins/payment-retries-plugin,plugins/catalog-plugin-test test \
            -Dtest=TestSemanticVersion,TestYamlDescriptorParser,TestDefaultEventBus,TestPluginInstaller,TestJarSignatureVerifier,TestPluginInstallAudit,TestDynamicInvoiceFormatter,TestSharedFormatterContract,TestKillbillApiWrapper,TestRulesComputer,TestPaymentRetriesStats,TestCatalogTestPluginApi \
            -Dsurefire.failIfNoSpecifiedTests=false -DsurefireArgLine="$TEST_JVM_ARGS"
          killbill-mvn -pl killbill/util,killbill/jaxrs test \
            -Dtest=TestNodeInfoMapper,TestPluginClusterResource \
            -Dsurefire.failIfNoSpecifiedTests=false -DsurefireArgLine="$TEST_JVM_ARGS"
      - name: Verify acceptance failure guards
        run: python3 -m unittest discover -s tools/validation -p 'test_*.py' -v
      - name: Verify notification shutdown and completion drain
        run: >-
          killbill-mvn -pl killbill-commons/queue test
          -Dtest=TestQueueCompletionShutdown,TestNotificationQueueShutdown
          -DsurefireArgLine="-Xmx1024m -Duser.language=en -Duser.country=US
          --add-opens=java.base/java.lang=ALL-UNNAMED
          --add-opens=java.base/java.io=ALL-UNNAMED
          --add-opens=java.base/java.util=ALL-UNNAMED
          --add-opens=java.base/java.base=ALL-UNNAMED"
      - name: Validate PostgreSQL durable events and production WAR recovery
        run: >-
          python3 tools/validation/validate.py --skip-build
          --maven "$(command -v mvn)" --java-home "$JAVA_HOME"
          --postgres-container '${{ job.services.postgres.id }}'
          --redis-container '${{ job.services.redis.id }}'
          --output var/release-validation/ci
      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          if-no-files-found: ignore
          path: |
            var/release-validation/**/report.json
            var/release-validation/**/*.log
